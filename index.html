<style>
:root{color-scheme:light;--ink:#252a29;--muted:#626660;--ground:#f3f2ed;--paper:#fffefa;--accent:#325c72}*{box-sizing:border-box}body{margin:0;background:var(--ground);color:var(--ink);font-family:Arial,Helvetica,sans-serif}header,main,footer{width:min(100% - 48px,980px);margin-inline:auto}header{padding:55px 0 35px;display:flex;justify-content:space-between;align-items:baseline;gap:20px;border-bottom:1px solid #d8d9d1}h1{font:normal clamp(25px,4vw,36px)/1.2 Georgia,serif;margin:0}header p,footer{font-size:14px;color:var(--muted)}header p{margin:0}.gallery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:64px 80px;padding:48px 30px 64px}figure{margin:0;min-width:0}.preview{width:100%;aspect-ratio:210/297;position:relative}figcaption{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-top:24px}h2{font:normal 23px/1.25 Georgia,serif;margin:0}.status{font-size:12px;letter-spacing:.04em;color:var(--muted)}.app{background:#ecf1f4;border:1px solid #b8c5cb;box-shadow:0 15px 30px #263d4818;overflow:hidden;container-type:inline-size}.paper{contain:size;overflow:hidden;background:var(--paper);border:1px solid #dfdfd7;box-shadow:4px 5px 0 -1px #fffefa,4px 5px 0 0 #ddded6,9px 11px 0 -1px #faf9f3,9px 11px 0 0 #d6d7cf,0 20px 30px #2b30221a;padding:13% 12%;container-type:inline-size}.paperhead{font:3cqw Georgia,serif;text-align:center;letter-spacing:.08em;color:#7a7e76}.paper h3{font:normal 9cqw/1.2 Georgia,serif;text-align:center;margin:14% 0 6%}.byline{text-align:center;font:3.7cqw Georgia,serif;color:#666b63}.rule{height:1px;background:#c5c8bf;margin:12% 0 9%}.sectionname{font:bold 4.2cqw Georgia,serif;margin:0 0 5%}.lines{height:21%;background:repeating-linear-gradient(to bottom,#8c92864d 0,#8c92864d 1px,transparent 1px,transparent 9px);clip-path:polygon(0 0,100% 0,100% 85%,65% 85%,65% 100%,0 100%)}.columns{display:grid;grid-template-columns:1fr 1fr;gap:8%;height:28%;margin-top:10%}.columns .lines{height:100%}.page-number{position:absolute;bottom:6%;left:0;right:0;text-align:center;color:#82867c;font:12px Georgia,serif}.ideas{grid-column:1/-1;width:100%;justify-self:center;container-type:inline-size}.board{height:calc((100cqw - 80px) / 2);aspect-ratio:auto;background:#232b29;border:8px solid #4c5049;box-shadow:0 15px 25px #28312c20,inset 0 0 50px #0c121480;color:#f3f2e9;overflow:hidden}.board svg{display:block;width:100%;height:100%}.chalk{font-family:'Chalkboard SE','Bradley Hand',cursive;fill:#f0f0e5}.board path,.board ellipse{stroke:#e5e9df;stroke-width:2;fill:none;stroke-linecap:round;opacity:.8}footer{padding:24px 0 32px;border-top:1px solid #d8d9d1;display:flex;justify-content:space-between;gap:20px}footer p{margin:0}@media(min-width:1400px){.gallery{padding-top:58px}}@media(max-width:650px){header,main,footer{width:calc(100% - 40px)}header{padding-top:32px;display:block}header p{margin-top:12px}.gallery{grid-template-columns:1fr;gap:48px;padding:32px 9px 48px}.ideas{grid-column:auto;width:100%}figcaption{margin-top:22px}h2{font-size:22px}.status{font-size:12px}footer{flex-wrap:wrap}.board{border-width:6px;height:auto;aspect-ratio:297/210}}@media(prefers-reduced-motion:no-preference){.preview{transition:transform .25s ease}figure:hover .preview{transform:translateY(-3px)}}

.live-app{overflow:hidden;background:#f5f7f5;container-type:normal}
.live-app iframe{display:block;border:0;transform-origin:top left;max-width:none}
.pdf-page{padding:0;contain:size;display:flex;align-items:center;justify-content:center;background:white}
.pdf-page canvas{display:block;max-width:100%;max-height:100%;object-fit:contain}
#pdf-message{position:absolute;padding:24px;font-size:16px;text-align:center;color:var(--muted)}
#pdf-message[hidden]{display:none}
.open-link{font-size:14px;line-height:1.5;color:#325c72;text-decoration:underline;text-underline-offset:4px}
.open-link:focus-visible,button:focus-visible{outline:3px solid #325c72;outline-offset:4px}
.panel-note{font-size:14px;line-height:1.6;color:var(--muted);margin:14px 0 0}
.pdf-controls{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:24px;min-height:36px;font-size:14px}
.pdf-controls button{font:inherit;font-size:16px;line-height:1;background:#3b3f43;border:0;border-radius:3px;height:29.33px;padding:0;color:#fff;cursor:pointer}
#pdf-prev{width:76px}
#pdf-next{width:61.42px}
.pdf-controls button:disabled{background:#62666a;cursor:default}
figure:hover .preview{transform:none}

.panel-caption{justify-content:flex-end;margin:0 0 12px}
.author{position:relative;font-size:14px}
.author-name{font:inherit;color:var(--muted);border:0;background:none;padding:10px 0;cursor:pointer}
.author-actions{max-width:calc(100vw - 40px);width:max-content;position:absolute;right:0;top:100%;display:flex;white-space:normal;background:var(--paper);border:0;border-radius:5px;box-shadow:0 8px 20px #252a2918;z-index:5;overflow:hidden}
.author-actions[hidden]{display:none}
.author-actions button,.author-actions a{min-width:0;flex:0 1 auto;font:inherit;border:0;padding:8px 11px;text-decoration:none;cursor:pointer}
.author-actions button{color:#fff;background:#3b3f43}
.author-actions a{color:#ffac45;background:#102440}
.author-actions button:hover{background:#484d52}
.author-actions a:hover{background:#193454}
.author-actions :focus-visible{outline:2px solid #fff;outline-offset:-4px}
dialog{width:min(480px,calc(100% - 32px));border:1px solid #d8d9d1;border-radius:8px;padding:28px;background:var(--paper);color:var(--ink);box-shadow:0 24px 80px #0003}
dialog::backdrop{background:#18252066}
.dialog-heading{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:22px}
.dialog-heading h2{font-size:26px}
.dialog-close{background:none;border:0;font:inherit;font-size:25px;cursor:pointer;color:var(--muted)}
.contact-form label{display:block;font-size:14px;margin:18px 0 7px}
.contact-form input,.contact-form textarea{box-sizing:border-box;width:100%;padding:11px;border:1px solid #b8c5bb;border-radius:4px;font:inherit;background:white}
.contact-form textarea{resize:vertical;min-height:140px}
.contact-form input:focus-visible,.contact-form textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.contact-form p{font-size:14px;line-height:1.6;color:var(--muted)}
.contact-send{font:inherit;border:0;border-radius:4px;padding:11px 18px;background:var(--accent);color:white;cursor:pointer}
.contact-send:disabled{opacity:.5;cursor:default}
@media(max-width:650px){.author{margin-top:6px;display:inline-block}.author-actions{left:0;right:auto}}
</style>
