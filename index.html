<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="A workspace for an application, a manuscript, and ideas in progress.">
<title>Work in progress — zibaee-2021</title>
<style>
:root{color-scheme:light;--ink:#252a29;--muted:#626660;--ground:#f3f2ed;--paper:#fffefa;--accent:#325c72}*{box-sizing:border-box}body{margin:0;background:var(--ground);color:var(--ink);font-family:Arial,Helvetica,sans-serif}header,main,footer{width:min(100% - 48px,980px);margin-inline:auto}header{padding:55px 0 35px;display:flex;justify-content:space-between;align-items:baseline;gap:20px;border-bottom:1px solid #d8d9d1}h1{font:normal clamp(25px,4vw,36px)/1.2 Georgia,serif;margin:0}header p,footer{font-size:14px;color:var(--muted)}header p{margin:0}.gallery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:64px 80px;padding:48px 30px 64px}figure{margin:0;min-width:0}.preview{width:100%;aspect-ratio:210/297;position:relative}figcaption{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-top:24px}h2{font:normal 23px/1.25 Georgia,serif;margin:0}.status{font-size:12px;letter-spacing:.04em;color:var(--muted)}.app{background:#ecf1f4;border:1px solid #b8c5cb;box-shadow:0 15px 30px #263d4818;overflow:hidden;container-type:inline-size}.paper{contain:size;overflow:hidden;background:var(--paper);border:1px solid #dfdfd7;box-shadow:4px 5px 0 -1px #fffefa,4px 5px 0 0 #ddded6,9px 11px 0 -1px #faf9f3,9px 11px 0 0 #d6d7cf,0 20px 30px #2b30221a;padding:13% 12%;container-type:inline-size}.paperhead{font:3cqw Georgia,serif;text-align:center;letter-spacing:.08em;color:#7a7e76}.paper h3{font:normal 9cqw/1.2 Georgia,serif;text-align:center;margin:14% 0 6%}.byline{text-align:center;font:3.7cqw Georgia,serif;color:#666b63}.rule{height:1px;background:#c5c8bf;margin:12% 0 9%}.sectionname{font:bold 4.2cqw Georgia,serif;margin:0 0 5%}.lines{height:21%;background:repeating-linear-gradient(to bottom,#8c92864d 0,#8c92864d 1px,transparent 1px,transparent 9px);clip-path:polygon(0 0,100% 0,100% 85%,65% 85%,65% 100%,0 100%)}.columns{display:grid;grid-template-columns:1fr 1fr;gap:8%;height:28%;margin-top:10%}.columns .lines{height:100%}.page-number{position:absolute;bottom:6%;left:0;right:0;text-align:center;color:#82867c;font:12px Georgia,serif}.ideas{grid-column:1/-1;width:calc((100% - 80px) * .707142857);justify-self:center}.board{aspect-ratio:297/210;background:#232b29;border:8px solid #4c5049;box-shadow:0 15px 25px #28312c20,inset 0 0 50px #0c121480;color:#f3f2e9;overflow:hidden}.board svg{display:block;width:100%;height:100%}.chalk{font-family:'Chalkboard SE','Bradley Hand',cursive;fill:#f0f0e5}.board path,.board ellipse{stroke:#e5e9df;stroke-width:2;fill:none;stroke-linecap:round;opacity:.8}footer{padding:24px 0 32px;border-top:1px solid #d8d9d1;display:flex;justify-content:space-between;gap:20px}footer p{margin:0}@media(min-width:1400px){.gallery{padding-top:58px}}@media(max-width:650px){header,main,footer{width:calc(100% - 40px)}header{padding-top:32px;display:block}header p{margin-top:12px}.gallery{grid-template-columns:1fr;gap:48px;padding:32px 9px 48px}.ideas{grid-column:auto;width:100%}figcaption{margin-top:22px}h2{font-size:22px}.status{font-size:12px}footer{flex-wrap:wrap}.board{border-width:6px}}@media(prefers-reduced-motion:no-preference){.preview{transition:transform .25s ease}figure:hover .preview{transform:translateY(-3px)}}

.live-app{overflow:hidden;background:#f5f7f5;container-type:normal}
.live-app iframe{display:block;border:0;transform-origin:top left;max-width:none}
.pdf-page{padding:0;contain:size;display:flex;align-items:center;justify-content:center;background:white}
.pdf-page canvas{display:block;max-width:100%;max-height:100%;object-fit:contain}
#pdf-message{position:absolute;padding:24px;font-size:16px;text-align:center;color:var(--muted)}
#pdf-message[hidden]{display:none}
.open-link{font-size:14px;line-height:1.5;color:#325c72;text-decoration:underline;text-underline-offset:4px}
.open-link:focus-visible,button:focus-visible{outline:3px solid #325c72;outline-offset:4px}
.panel-note{font-size:14px;line-height:1.6;color:var(--muted);margin:14px 0 0}
.pdf-controls{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:14px;font-size:14px}
.pdf-controls button{font:inherit;background:#fffefa;border:1px solid #c7cbc3;border-radius:4px;min-height:36px;padding:6px 10px;color:var(--ink);cursor:pointer}
.pdf-controls button:disabled{opacity:.45;cursor:default}
figure:hover .preview{transform:none}
</style>
</head>
<body>
<header><h1>Work in progress</h1><p>zibaee-2021</p></header>
<main aria-label="Projects"><div class="gallery">
<figure>
<div class="preview app live-app" id="salsa-preview">
<iframe id="salsa-frame" src="https://salsa-maru.onrender.com/" title="SALSA interactive sequence analysis application" width="840" height="1188" loading="eager"></iframe>
</div>

<figure>

<figcaption><h2>Ideas &amp; sketches</h2><span class="status">Taking shape</span></figcaption>
</figure>
</div></main>
<footer><p>Application · Manuscript · Ideas</p><p>A space for things in the making.</p></footer>



<script type="module" src="gallery.js"></script>
</body></html>
